<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/media.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <script src="models/drawable-object.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/coin-counter.class.js"></script>
    <script src="models/bottle-counter.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
  </head>
  <body>
    <div class="game-container">
      <div class="start-screen">
        <h1>El Pollo Loco</h1>

        <button id="play-button" onclick="startGame()">Play</button>

        <div class="controls-grid">
          <div class="key-group">
            <div class="key">←</div>
            <div class="key">→</div>
          </div>
          <span>Move</span>

          <div class="key key-space">SPACE</div>
          <span>Jump</span>

          <div class="key">D</div>
          <span>Throw Bottle</span>
        </div>
      </div>

      <canvas id="canvas" width="720" height="480"> </canvas>
    </div>
  </body>
</html>
